<section class="comments"
    data-mastodon-comments
    data-host="{{ config.extra.mastodon.host }}"
    data-username="{{ config.extra.mastodon.username }}"
    data-status-id="{{ id }}">
    <h2>Comments</h2>
    <p><a href="https://{{ config.extra.mastodon.host }}/@{{ config.extra.mastodon.username }}/{{ id }}">Respond to this
            post</a> with an account on the Fediverse (like Mastodon).</p>
    <p>
        <button class="comments-load" type="button">Load comments from Mastodon</button>
    </p>
    <p class="comments-status" role="status" aria-live="polite"></p>
    <div class="comments-wrapper">
        <noscript>JavaScript is required to load comments here. You can still read them in the
            <a href="https://{{ config.extra.mastodon.host }}/@{{ config.extra.mastodon.username }}/{{ id }}">original Mastodon thread</a>.
        </noscript>
    </div>
    <script src="/comments/purify.min.js" defer></script>
    <script src="/comments/comments.js" defer></script>
</section>
